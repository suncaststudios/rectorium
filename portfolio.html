<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Rectorium · Portfolio</title>
<meta name="description" content="Games, art, music and posts by r3ctrr313. Simplified portfolio view.">
<link rel="icon" type="image/webp" href="assets/img/thumb/vivi4nite-logo.webp">
<link rel="stylesheet" href="css/style.css">
<style>
.two:not(:has(img.c)){grid-template-columns:1fr}
html,body{overflow:auto;height:auto}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;padding:10px 20px}
header.top b{letter-spacing:.2em;text-transform:uppercase;color:var(--accent)}
header.top nav{display:flex;gap:14px;flex-wrap:wrap;flex:1}
header.top a{text-decoration:none}
main.pf{max-width:1000px;margin:0 auto;padding:20px}
section{margin:0 0 44px;scroll-margin-top:70px}
section>h2{font-size:18px;text-transform:uppercase;letter-spacing:.14em;border-bottom:1px solid var(--line);padding-bottom:6px;margin-bottom:14px}
.hero{padding:40px 0 30px}.hero h1{font-size:clamp(28px,6vw,52px);color:var(--accent);text-transform:uppercase;letter-spacing:.12em}
.two{display:grid;grid-template-columns:200px 1fr;gap:16px;margin-bottom:18px;align-items:start}
.two img.c{width:100%;aspect-ratio:1;object-fit:cover;border:1px solid var(--line)}
audio{width:100%;margin:2px 0 8px}
dialog{background:var(--bg);color:var(--fg);border:1px solid var(--accent);max-width:min(94vw,900px);padding:10px}
dialog::backdrop{background:rgba(0,0,0,.85)}dialog img{max-width:100%;max-height:78vh;display:block;margin:0 auto 8px}
@media(max-width:600px){.two{grid-template-columns:1fr}}
.grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
</style>
</head>
<body>
<header class="top"><b>The Rectorium</b><nav aria-label="Sections"><a href="#games">Games</a><a href="#art">Art</a><a href="#music">Music</a><a href="#posts">Posts</a><a href="#about">About</a><a href="#archive">Archive</a></nav><a href="index.html"><button>OPEN DESKTOP VERSION</button></a></header>
<main class="pf" id="pf"><div class="empty">Loading…</div></main>
<dialog id="dlg"><img id="dimg" alt="" draggable="false"><b id="dt"></b><div class="dim" id="dd"></div><form method="dialog"><button>CLOSE</button></form></dialog>
<script type="module" src="js/portfolio.js"></script>
</body>
</html>
